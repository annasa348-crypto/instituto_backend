spring.application.name=instituto-backend
server.port=8080

# --- PostgreSQL (crear antes la base: CREATE DATABASE instituto;) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/instituto
spring.datasource.username=postgres
spring.datasource.password=CAMBIAR_PASSWORD

# --- JPA / Hibernate ---
# update crea/modifica las tablas automáticamente (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Datos de prueba (data.sql) ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Seguridad ---
# Contraseña del usuario 'admin' que se crea la primera vez que arranca el sistema.
# CAMBIARLA (y no subir la real a GitHub).
app.admin.password=admin1234
